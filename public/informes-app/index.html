<style>

  --ink-800: #1a1a1a;
  --ink-700: #303030;
  --pearl: #e2deda;
  --pearl-300: #cccccc;
  --gold: #9b7f57;
  --gold-400: #a69478;
  --gold-100: #e8e0c9;
  --paper: #ffffff;
  --teal-600: #487e7f;
  --teal-900: #003a54;
  --teal-200: #a5cecd;
  --teal-ink: #234047;
  --slate-600: #51647e;
  --slate-700: #44546a;
  --orange-marker: #ee8640;
  --orange-text: #e97132;
  --warm-mauve: #eae6e7;
  --row-a: #e7eaed;
  --row-b: #ccd2d8;
  --table-head: #cfcfcf;
  --rule-grey: #d9d9d9;
  --fin-head: #1f3864;

/* Tokens de la herramienta: los del portal icam web dashboard (tailwind.config.js). Solo tema claro,
   como el portal. Las slides NO usan estas variables: siguen con los tokens del design system (arriba). */
:root {
  --a-fondo: #F5F5F5; --a-sup: #FFFFFF; --a-sup2: #F5F5F5; --a-tinta: #2C2C2C; --a-titulo: #1E2A56; --a-sutil: #6E6E6E;
  --a-linea: #EAEBEE; --a-marca: #1E2A56; --a-marca-hover: #2B3668; --a-marca-t: #FFFFFF; --a-oro: #B89660; --a-suave: rgba(30, 42, 86, .05);
  --a-ok: #047857; --a-aviso: #b45309; --a-error: #dc2626; --a-foco: rgba(30, 42, 86, .3);
  --a-sombra: 0 1px 3px rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1);
  --a-ok-fondo: #f0fdf4; --a-ok-borde: #bbf7d0; --a-ok-texto: #14532d;
  --a-aviso-fondo: #fffbeb; --a-aviso-borde: #fde68a; --a-aviso-texto: #92400e;
  --a-error-fondo: #fef2f2; --a-error-borde: #fecaca; --a-error-texto: #b91c1c;
  --a-fuente: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--a-fondo); color: var(--a-tinta); font: 14px/1.5 var(--a-fuente); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
/* Cabecera como la del portal: barra navy de 56 px, logo y pestaña activa con subrayado dorado. */
.cab { background: #1E2A56; border-bottom: 1px solid rgba(255, 255, 255, .1); position: relative; z-index: 2; }
.cab-in { max-width: 1120px; margin: 0 auto; min-height: 56px; padding-inline: 24px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.marca { display: flex; align-items: center; gap: 20px; margin: 0; align-self: stretch; }
.marca img { height: 30px; width: auto; max-width: 220px; display: block; mix-blend-mode: lighten; }
.marca span { align-self: stretch; display: flex; align-items: center; padding-top: 3px; border-bottom: 3px solid #B89660; font-size: 14px; font-weight: 500; color: #fff; }
.cab-estado { font-size: 13px; color: rgba(255, 255, 255, .6); }
/* Dentro del portal ya está su cabecera: se oculta la de la app y el estado va arriba del contenido. */
body.en-portal .cab { display: none; }
.estado-portal { font-size: 12px; color: var(--a-sutil); min-height: 18px; margin-bottom: -12px; text-align: right; }
main { max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 24px; display: flex; flex-direction: column; gap: 20px; }
h2 { font-family: var(--a-fuente); font-weight: 600; font-size: 20px; line-height: 28px; color: var(--a-titulo); margin: 0; text-wrap: balance; }
h3 { font-size: 14px; font-weight: 600; color: var(--a-titulo); margin: 0 0 4px; }
p { margin: 0; }
/* Las slides heredaban el tracking de los h2/h3 del estilo anterior de la herramienta y así están
   aprobados los informes: se fija aquí para que el cambio de estética no toque ni slides ni PDF. */
.iq-slide h2 { letter-spacing: .02em; }
.iq-slide h3 { letter-spacing: .08em; }
/* Negrita del portal (600) solo en la herramienta: dentro de las slides manda bundle.css. */
.tarjeta b, .tarjeta strong, .ed-barra b, .aviso b { font-weight: 600; }
.sutil { color: var(--a-sutil); font-size: 13px; }
.tarjeta { background: var(--a-sup); border: 1px solid var(--a-linea); border-radius: 8px; padding: 16px; box-shadow: var(--a-sombra); display: flex; flex-direction: column; gap: 14px; }
.fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fila-sep { justify-content: space-between; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: var(--a-titulo); }
.campo input, .campo select, .campo textarea, textarea, select, input[type=text] {
  font: inherit; font-size: 14px; font-weight: 400; color: var(--a-titulo); background: var(--a-sup2); border: 1px solid var(--a-linea);
  border-radius: 6px; min-height: 40px; padding: 8px 12px; width: 100%; max-width: 100%; }
input::placeholder, textarea::placeholder { color: var(--a-sutil); }
.campo input:focus, .campo select:focus, textarea:focus, select:focus, input[type=text]:focus { border-color: var(--a-marca); outline: none; box-shadow: 0 0 0 1px var(--a-foco); }
textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--a-marca); outline-offset: 2px; }
.btn { font: inherit; font-size: 14px; font-weight: 500; border-radius: 6px; min-height: 40px; padding: 8px 16px; cursor: pointer;
  background: var(--a-sup); color: var(--a-titulo); border: 1px solid var(--a-linea); transition: background-color .15s, color .15s; }
.btn:hover { background: var(--a-fondo); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-prim { background: var(--a-marca); color: var(--a-marca-t); border-color: var(--a-marca); }
.btn-prim:hover { background: var(--a-marca-hover); border-color: var(--a-marca-hover); }
.btn-prim[disabled]:hover { background: var(--a-marca); }
.btn-go { font-size: 15px; min-height: 44px; padding: 10px 24px; }
.btn-min { font-size: 12px; min-height: 32px; padding: 4px 10px; }
.btn-peligro { color: #fff; background: #dc2626; border-color: #dc2626; }
.btn-peligro:hover { background: #b91c1c; border-color: #b91c1c; }
/* En filas y cabeceras el borrado es discreto, como en el portal; el rojo lleno queda para confirmar. */
.btn-min.btn-peligro { background: var(--a-sup); color: #dc2626; border-color: #fecaca; }
.btn-min.btn-peligro:hover { background: #fef2f2; border-color: #fca5a5; }
.confirmar .btn-min.btn-peligro { background: #dc2626; color: #fff; border-color: #dc2626; }
.confirmar { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.adjuntos { display: flex; flex-wrap: wrap; gap: 6px; }
.adjunto { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--a-linea); background: var(--a-sup2); }
.adjunto img { width: 28px; height: 22px; object-fit: cover; border-radius: 4px; }
.soltar.mini { padding: 10px; font-size: 13px; }
.btn-texto { background: none; border: none; padding: 4px 6px; color: var(--a-marca); text-decoration: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; }
.btn-texto:hover { text-decoration: underline; }
.pasos { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; counter-reset: paso; }
.pasos li { counter-increment: paso; font-size: 12px; font-weight: 500; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--a-linea); color: var(--a-titulo); background: var(--a-sup); }
.pasos li::before { content: counter(paso); display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; margin-right: 6px; background: var(--a-fondo); color: var(--a-sutil); font-weight: 600; font-size: 11px; }
.pasos li.hecho::before { content: "✓"; background: #059669; color: #fff; }
.pasos li.actual { background: var(--a-marca); border-color: var(--a-marca); color: #fff; }
.pasos li.actual::before { background: #fff; color: var(--a-marca); }
.aviso { border: 1px solid var(--a-aviso-borde); background: var(--a-aviso-fondo); color: var(--a-aviso-texto); padding: 10px 14px; font-size: 14px; border-radius: 6px; }
.aviso.error { border-color: var(--a-error-borde); background: var(--a-error-fondo); color: var(--a-error-texto); }
.aviso.ok { border-color: var(--a-ok-borde); background: var(--a-ok-fondo); color: var(--a-ok-texto); }
.aviso .btn-texto { color: inherit; text-decoration: underline; }
.tabla-env { overflow-x: auto; border: 1px solid var(--a-linea); border-radius: 8px; background: var(--a-sup); }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th { text-align: left; font-size: 14px; color: var(--a-titulo); font-weight: 600; padding: 12px; background: rgba(234, 235, 238, .3); border-bottom: 1px solid var(--a-linea); }
table.t td { padding: 12px; border-bottom: 1px solid var(--a-linea); vertical-align: top; }
table.t tr:last-child td { border-bottom: none; }
table.t td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--a-linea); color: var(--a-sutil); border: 1px solid transparent; white-space: nowrap; }
.chip.ok { color: var(--a-ok-texto); border-color: var(--a-ok-borde); background: var(--a-ok-fondo); }
.chip.aviso { color: #b45309; border-color: var(--a-aviso-borde); background: var(--a-aviso-fondo); }
.chip.error { color: var(--a-error-texto); border-color: var(--a-error-borde); background: var(--a-error-fondo); }
.chip.marca { color: var(--a-titulo); border-color: transparent; background: rgba(184, 150, 96, .15); }
.estrella { color: var(--a-oro); font-weight: 600; }
.lista { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.soltar { border: 1px dashed #cfd1d7; border-radius: 6px; padding: 18px; text-align: center; color: var(--a-sutil); background: var(--a-fondo); cursor: pointer; font-size: 14px; }
.soltar:hover, .soltar.encima { border-color: var(--a-marca); color: var(--a-marca); }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.foto { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.foto img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--a-fondo); border: 1px solid var(--a-linea); }
.progreso { display: flex; flex-direction: column; gap: 2px; }
.progreso-fila { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--a-linea); font-size: 14px; }
.progreso-fila .ico { text-align: center; font-weight: 600; }
.en-curso .ico { color: var(--a-marca); animation: latido 1.2s ease-in-out infinite; }
@keyframes latido { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .en-curso .ico { animation: none; } }
.barra { height: 6px; background: var(--a-linea); border-radius: 999px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--a-marca); transition: width .3s; }
/* Editor */
.ed-lista { display: flex; flex-direction: column; gap: 24px; }
.ed-slide { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
.ed-barra { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.ed-barra b { font-size: 14px; color: var(--a-titulo); }
.ed-barra .tit { color: var(--a-sutil); }
.ed-barra .acc { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.v-marco { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border: 1px solid var(--a-linea); background: #fff; border-radius: 6px; box-shadow: var(--a-sombra); }
.v-marco > .v-escala { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; }
.v-marcas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: auto; }
.marcando .v-marcas { pointer-events: auto; cursor: crosshair; touch-action: none; }
.marcando .v-marco { outline: 2px solid var(--a-error); outline-offset: 2px; }
.ed-barra .btn.activo { background: var(--a-error); border-color: var(--a-error); color: #fff; }
.marcar-barra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; background: var(--a-sup); border: 1px solid var(--a-linea); border-radius: 8px; padding: 8px 10px; box-shadow: var(--a-sombra); }
.marcar-barra .btn[aria-pressed="true"] { background: var(--a-marca); border-color: var(--a-marca); color: #fff; }
.marcar-barra .sutil { font-size: 13px; }
.marcar-barra .der { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.marcas-lista { font-size: 13px; color: var(--a-sutil); margin: 0; }
.ed-corregir { display: flex; flex-direction: column; gap: 8px; background: var(--a-sup); border: 1px solid var(--a-linea); border-radius: 8px; padding: 12px; box-shadow: var(--a-sombra); }
.ed-corregir textarea { min-height: 70px; }
.ed-fuentes { font-size: 12px; color: var(--a-sutil); }
mark.v-pend { background: #ffe58a; color: inherit; outline: 1px dashed #b35c00; }
.iq-bloqueado-sello { top: auto !important; bottom: 40px; }
#lienzo-oculto { position: absolute; left: -20000px; top: 0; width: 960px; pointer-events: none; }
#lienzo-oculto .v-lienzo { width: 960px; height: 540px; position: relative; overflow: hidden; background: #fff; }
#lienzo-oculto.exportando .iq-bloqueado-sello, #lienzo-oculto.exportando mark.v-pend { display: none !important; }
.oculto { display: none !important; }
@media (max-width: 640px) { h2 { font-size: 18px; } main, .cab-in { padding-inline: 16px; } .btn-go { width: 100%; } .ed-barra .acc { margin-left: 0; } }
</style>

<script id="ref-api" type="text/plain">// Impar Capital · Informes Trimestrales — window.ImparInformes
// Todos los componentes pintan sobre un lienzo 960 × 540. Texto con "**negrita**".
type Rich = string;

<script id="ref-recetas" type="text/plain"># informe.json y catálogo de layouts

El informe es un único `informe.json`. El visor lo pinta con los componentes del design system
(`design-system/project/components/bundle.js`, API en `index.d.ts`). Nunca se escribe HTML a mano.

## Estructura del fichero

```json
{
  "meta": {
    "proyecto": "Santa Engracia 84", "codigo": "SE84",
    "trimestre": "Q3 2026", "trimestreAnterior": "Q2 2026", "siguiente": "Q4 2026",
    "fechaCierre": "2026-09-30", "arquetipo": "A",
    "pie": { "variante": "cnmv", "tipo": "fondo", "fondo": "Impar Prime Alternative Investment Fund", "isin": "ES0147869004" },
    "version": "v1", "estado": "Borrador", "actualizado": "2026-09-24",
    "artifact": "https://claude.ai/artifact/…"
  },
  "slides": [ …en orden… ]
}
```

- `pie`: `{"variante":"sl","vehiculo":"…, S.L.","nif":"B…"}` para sociedades; `{"variante":"cnmv","tipo":"fondo","fondo":"…","isin":"…"}` para FICC/FCR. Se copia del informe anterior; lo aporta Legal/Finanzas, nunca se inventa.
- El visor añade solo `pie` y `pagina` (posición entre los slides visibles). No los escribas en cada slide.

## Un slide

Tres formas:

1. **Slide completo** (componente que ya es un slide):
   `{"id":"resumen-ejecutivo","c":"ResumenEjecutivo","props":{…},"origen":"actualizada","fuentes":"notas PM 15/09; KPI obra"}`
2. **Slide compuesto** (cabecera + bloques):
   `{"id":"calendario","compuesto":{"seccion":3,"titulo":"Resumen de Proyecto. Calendario","clase":"iq-cols","contenido":[nodos…],"nota":"**Nota:** …"},"origen":"…","fuentes":"…"}`
   - `clase`: `iq-cols` (dos columnas 48/48, cada hijo es una columna) o `iq-apilado` (vertical). Sin clase: flujo normal.
   - `estilo`: objeto CSS opcional (p. ej. `{"gridTemplateColumns":"1fr 270px"}` para texto + columna de mapa).
3. **Oculto**: añade `"oculto": true` para quitarlo del informe sin perderlo.

Campos de control (no se pintan en el PDF; el visor los muestra debajo del slide):
- `id`: estable, en minúsculas con guiones. Nunca se renombra (las correcciones lo referencian).
- `origen`: `heredada` (igual que el trimestre anterior), `actualizada`, `nueva`, `bloqueada` (Finanzas/Legal).
- `fuentes`: de dónde sale cada dato (p. ej. «acta obra 12/09; correo operador 03/09; informe Q2»). Obligatorio en slides con datos nuevos.

## Nodos

Un nodo es un texto o `{"c": "Componente", "props": {…}, "hijos": [nodos]}`. `c` puede ser cualquier componente
de `ImparInformes` o `div`/`span`/`p`. Dentro de `props`, cualquier objeto con `c` también se convierte en nodo
(así se pasan `izquierda`/`derecha` de `DosColumnas`). Texto enriquecido: solo `**negrita**` para el dato clave.

Bloques más usados:
- `{"c":"Subtitulo","hijos":["ESTRATEGIA DE PROYECTO"]}` — mayúsculas navy. `{"c":"Subtitulo","props":{"nivel":2},"hijos":["Novedades. Q3 2026"]}`.
- `{"c":"Texto","props":{"parrafos":["…","…"]}}`
- `{"c":"Vinetas","props":{"items":["**Inicio de obra**: enero de 2026"],"compacta":true}}`
- `{"c":"ImagenMarco","props":{"src":"fotos/fachada.jpg","ancho":348,"alto":290,"pie":"Fachada a septiembre de 2026"}}`
- `{"c":"div","props":{"style":{"marginTop":24}},"hijos":[…]}` — solo para separar; no inventes estilos de color o fuente.

## Catálogo (sección → layout → receta)

Los límites de caracteres del design system son **orientativos**: manda la medición real de `construir.py` (desborde y
relleno ≥ 85 %). Nunca se reduce la letra. Capacidad aproximada al tamaño actual (cuerpo 10,5 pt), para planificar:

| Zona | Capacidad aproximada |
|---|---|
| Columna de `DosColumnas` / columna de texto de un compuesto `iq-cols` | 1.300–1.500 caracteres (≈ 22 líneas) |
| Texto a ancho completo | ≈ 2.800–3.000 caracteres |
| Columna de texto de `TextoImagen` | 1.000–1.300 caracteres |
| Texto a ancho completo sobre una galería `2` | ≈ 450 caracteres (3 líneas) |
| Rol de `Colaboradores` (2 columnas, con logos) | 3–4 roles por columna de ~350 caracteres |

Cada subtítulo resta ≈ 1 línea; cada viñeta compacta ≈ 0,8 líneas.

| id sugerido | Sección | Forma | Contenido y límites |

| `licitaciones` | 4 | compuesto con `TablaLicitaciones {titulo,columnas,filas}` | Estado de contratación por lote. |

| `seguimiento-economico-obra` | 5 | `SlideBloqueado` o compuesto con `TablaFinanciera` | Cifras de certificación solo si las aporta el PM/PMo. |

| `vehiculo` | 7 | `VehiculoInversion` | **`seccion` siempre explícita** (usa 6 por defecto). `detalles` (viñetas), 4 `fichas {icono,etiqueta,valor}` con iconos `vehiculo-aeat`, `vehiculo-obligacion-mercantil`, `vehiculo-inscripcion-rm`, `vehiculo-siguiente-informe`. Datos de Legal/Finanzas; actualizar «siguiente informe». |
| `consejo` | 7 | compuesto con `ConsejoAdministracion {titulo,intro,puntos}` | Solo sociedades con consejo. |
| `disclaimer` | — | `Disclaimer` | Sin `parrafos` (usa el texto vigente). Obligatorio, penúltimo. |
| `cierre` | — | `Cierre` | Obligatorio, último. |

El sello «BLOQUEADO · origen · versión» de `SlideBloqueado` solo se ve en el visor; no sale en el PDF.

Cartera / multi-activo (arquetipo E): `cartera-ocupacion` (`DonutOcupacion`), `cartera-rentas` (`TablaMensual`), `cartera-calendario` (`TimelineTrimestral`), `KpiIconosFinancieros`.

Los ids `situacion-<tema>` de la biblioteca (licencia, arquitectura, interiorismo, ingeniería, suministros, marca, marketing, comercialización, inquilinos, reformas) usan `DosColumnas` o `TextoImagen` según haya imágenes.

## Heurística de elección

- ≤ 500 caracteres + 1 imagen → `TextoImagen`. > 900 → `DosColumnas` o partir.
- 1–2 fotos → imagen grande (`Galeria` `1`/`2`); 3–4 → `Galeria` `3`/`4`/`hero-2`; > 4 → otro slide.
- Dos módulos cortos del mismo ámbito → un `DosColumnas`. Un módulo largo → su propio slide.
- Títulos: «Sección. Subtema» en tipo frase; `SlideHeader` pone las mayúsculas y parte en el primer «. ». La parte antes del «. » ≤ 38 caracteres.</script>
<script id="ref-reglas" type="text/plain"># Redacción: tono, herencia entre trimestres y reglas de hechos

## Regla de oro: nada se inventa

Todo dato material (fecha, %, importe, empresa, licencia, hito, nº de inversores, puntuación) debe salir de:
el informe anterior, lo que aporta el usuario este trimestre (notas, correos, actas, documentos, Excel) o
los datos del vehículo. Cada dato nuevo se anota en `hechos.json` con su fuente.

- Falta un dato que el slide necesita → `[pendiente: qué falta]` en el texto y se lista en el resumen al usuario.
- Dos fuentes se contradicen → no elijas: pregunta y muestra ambas versiones.
- Puedes **interpretar y redactar** libremente: sintetizar, priorizar, explicar por qué importa un hito, proponer riesgos
  y objetivos. Todo lo que propongas sin respaldo directo (riesgos u objetivos sugeridos) se marca en la propuesta
  como «sugerido» y el usuario lo confirma.
- Las cifras financieras (TIR, ROE, varianzas, NOI…) nunca se calculan ni se redactan: son slides bloqueados de Finanzas.
- Fotos: solo las que aporta el usuario (o las del informe anterior si él lo confirma). Un pie de foto describe solo lo confirmado.

## Tiempo

Distingue siempre: hecho histórico · hecho del trimestre anterior · hecho de este trimestre · previsión.
- Nunca presentes una previsión como cumplida ni un hecho de Q-1 como logro de Q.
- Frases heredadas con «próximo trimestre», «previsto para…», «se iniciará…»: revisa si ya ocurrió; reescribe en pasado o actualiza la fecha.
- Usa el trimestre explícito («Q4 2026»), no «el próximo trimestre».

## Herencia desde el informe anterior (spec §69)

| Tipo | Ejemplos | Qué hacer |
|---|---|---|
| Persistente | estrategia, descripción del activo, compraventa, financiación, colaboradores, datos del vehículo | Se copia tal cual salvo cambio aportado. `origen: heredada`. |
| Del trimestre | «Durante el trimestre…», Novedades, logros | Solo como contexto: Novedades Q-1 → se resume en **Antecedentes Q** (≤ 400). Nunca se reutiliza como texto actual. |
| Estructurado | KPIs, hitos, riesgos, objetivos | Se arrastran los objetos y se actualizan: KPI con valor nuevo; hitos marcados como hechos o con fecha movida; riesgos activos/resueltos; objetivos Q-1 → estado. |
| Legal | disclaimer, pie | Texto vigente del design system; datos del vehículo del informe anterior. |
| Bloqueado | financiero, varianzas | Placeholder `SlideBloqueado` «Pendiente de Finanzas» hasta que llegue la página. |

Módulo sin cambios: conserva lo persistente; si el slide necesita una frase del periodo, «No se han producido cambios materiales en este ámbito durante el trimestre.» (no la pongas en todos lados; a menudo es mejor ocultar el slide).

## Bucle de objetivos

Los «Objetivos Qn» del informe anterior son el guion de este trimestre. Para cada uno infiere de las notas:
Cumplido · Parcial · No cumplido · Ya no aplica, con la evidencia. Los cumplidos alimentan Logros; los no cumplidos,
riesgos o retrasos (con su explicación) y, si siguen vigentes, los nuevos objetivos Q+1.

## Tono (spec §66)

Español institucional, factual y sobrio. Sin adjetivos promocionales, sin exclamaciones, sin emojis.
Fórmulas habituales, sin repetirlas mecánicamente: «Durante el trimestre…», «Se ha avanzado…», «Se mantiene…»,
«En paralelo…», «Asimismo…», «El foco continúa en…», «Se prevé…», «Se ha iniciado…», «Se ha formalizado…».
Evita relleno corporativo («se sigue trabajando para…») y afirmaciones positivas sin dato.

## Resumen ejecutivo (spec §67) — se escribe al final

Jerarquía: 1) fase actual; 2) logro(s) más material(es); 3) retrasos o incidencias relevantes y su mitigación;
4) avance hacia el siguiente gran hito; 5) operador / comercialización / desinversión; 6) próximas fechas críticas.
No concatenes módulos. Coherente al dígito con KPIs y calendario.

## Logros (spec §68)

Hechos concretos y, si hay fecha, fechados. 6 recomendados, 9 máximo. El usuario puede fijar uno.
- Bien: «Obtención de la licencia de obras el 8 de junio de 2026.»
- Mal: «Se continuó trabajando en el proyecto durante el trimestre.»

## Espacio: cada slide llena, sin tocar la letra

- Objetivo: **relleno ≥ 85 %** del área de contenido de cada slide (lo mide `construir.py`). Nunca se reduce el cuerpo de letra
  ni se cambian estilos: el tamaño es el del design system.
- Primero se llena con **información real**: el texto completo del informe anterior cuando sigue vigente (no lo resumas de
  más), las notas y documentos del trimestre, las condiciones y datos concretos (importes, fechas, nombres, pólizas,
  expedientes). Prefiere el detalle útil al resumen genérico.
- Si no hay más información real: 1) agranda fotos o usa una disposición mayor; 2) fusiona dos slides cortas del mismo
  ámbito; 3) cambia a un layout más compacto; 4) mueve un bloque de una slide llena a una vacía del mismo tema.
- Nunca rellenes con frases vacías («se sigue trabajando…») ni repitas datos de otra slide solo para ocupar.
- El visor reparte automáticamente el hueco restante entre las partes de la slide (entre bloques, párrafos y filas de
  tabla). Un subtítulo, o una frase que termina en «:», va siempre pegada a lo que introduce.
- Desborde (el texto no cabe): resume lo menos relevante o parte el slide; es bloqueante.

## Formatos

- Trimestres «Q3 2026». Cifras españolas: `12.000.000 €`, `76 %`, `1.907 m²`. Fechas del timeline `MM/AA`.
- Negrita solo para el dato clave de la frase. Viñetas con rótulo: «**Inicio de obra**: enero de 2026».
- Nombres oficiales tal cual (operadores, marcas, organismos, constructoras). Mismo nombre en todo el informe.
- Notas: «**Nota:** …».
- Archivo: `YYYYMMDD_{PROYECTO}_Qn AAAA_Informe Trimestral Inversores.pdf` (fecha = cierre del trimestre).</script>

<script>
(function () {
  'use strict';

  var PERMITIDOS = M.componentes();
  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/';
  // Dentro del portal ICAM (build --destino dashboard) claude-shim.js define window.ICAM:

  /* ================= Utilidades ================= */
  function $(sel, el) { return (el || document).querySelector(sel); }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function ahora() { return new Date().toISOString(); }
  function fecha(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function bytes(s) { return new TextEncoder().encode(s || '').length; }
  function recortar(s, max) {
    s = s || ''; if (bytes(s) <= max) return s;
    var lo = 0, hi = s.length;
    while (lo < hi) { var m = (lo + hi + 1) >> 1; if (bytes(s.slice(0, m)) <= max) lo = m; else hi = m - 1; }
    return s.slice(0, lo) + '\n[… recortado]';
  }
  function recorrer(v, fn, ruta) {
    ruta = ruta || []; fn(v, ruta);
    if (Array.isArray(v)) v.forEach(function (x, i) { recorrer(x, fn, ruta.concat(i)); });
    else if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { recorrer(v[k], fn, ruta.concat(k)); });
  }
  var NO_TEXTO = { src: 1, imagen: 1, vista: 1, foto: 1, mapa: 1, c: 1, icono: 1, variante: 1, disposicion: 1, layout: 1, clase: 1, id: 1, origen: 1, fuentes: 1, className: 1 };
  function textos(slide) {
    var out = [];
    recorrer(slide, function (v, r) { if (typeof v === 'string' && !NO_TEXTO[r[r.length - 1]] && r.indexOf('estilo') < 0 && r.indexOf('style') < 0) out.push(v.replace(/\*\*/g, '')); });
    return out.join(' · ');
  }
  function tituloDe(s) {
    if (s.compuesto) return s.compuesto.titulo || s.id;
    var p = s.props || {};
    return p.titulo || ({ Portada: 'Portada', Indice: 'Índice', ResumenEjecutivo: 'Resumen ejecutivo', SlideKpisRiesgosObjetivos: 'KPIs, riesgos y objetivos', Colaboradores: 'Colaboradores', Disclaimer: 'Disclaimer', Cierre: 'Cierre' })[s.c] || s.id;
  }
  function cargarScript(url) {
    return new Promise(function (ok, ko) {
      if ($('script[src="' + url + '"]')) return ok();
      var s = document.createElement('script'); s.src = url; s.onload = function () { ok(); }; s.onerror = function () { ko(new Error('No se pudo cargar ' + url)); };
      document.head.appendChild(s);
    });
  }

  /* Trimestres */
  function qParse(q) { var m = /^Q([1-4]) (\d{4})$/.exec(q || ''); return m ? { n: +m[1], a: +m[2] } : null; }
  function qStr(o) { return 'Q' + o.n + ' ' + o.a; }
  function qSig(q) { var o = qParse(q); return o.n === 4 ? qStr({ n: 1, a: o.a + 1 }) : qStr({ n: o.n + 1, a: o.a }); }
  function qAnt(q) { var o = qParse(q); return o.n === 1 ? qStr({ n: 4, a: o.a - 1 }) : qStr({ n: o.n - 1, a: o.a }); }
  function qCierre(q) { var o = qParse(q); return new Date(Date.UTC(o.a, o.n * 3, 0)).toISOString().slice(0, 10); }
  function qUltimoCerrado() { var d = new Date(); return qAnt(qStr({ n: Math.floor(d.getMonth() / 3) + 1, a: d.getFullYear() })); }
  function qLista() { var q = qSig(qSig(qUltimoCerrado())), out = []; for (var i = 0; i < 12; i++) { out.push(q); q = qAnt(q); } return out; }
  function limpiarCodigo(c) { return String(c || '').trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9_\-.]/g, '').slice(0, 40); }
  function idInforme(cod, q) { return limpiarCodigo(cod) + '_' + q.replace(' ', '-'); }

  /* ================= Capacidades de la plataforma ================= */

    : Promise.resolve();

  /* ================= Estado ================= */

    vista: 'inicio', paso: 0, cargado: false,
    proyectos: {}, informes: {},

  function estadoCab(t, error) { var el = $('#cab-estado'); el.textContent = t || ''; el.style.color = error ? 'var(--a-error)' : ''; }

  /* ================= Guardado (una escritura cada vez por documento) ================= */
  var colas = {}, temporizadores = {};
  function escribir(ruta, cuerpo, espera) {
    if (!C.db) return Promise.resolve();
    clearTimeout(temporizadores[ruta]);
    return new Promise(function (res) {
      temporizadores[ruta] = setTimeout(function () {
        var datos = clon(cuerpo);
        if (bytes(JSON.stringify(datos)) > 250000) { estadoCab('El documento supera el tamaño máximo; reduce fuentes o fotos.', true); return res(); }
        colas[ruta] = (colas[ruta] || Promise.resolve()).then(function () { return C.db.doc(ruta).set(datos); })
          .then(function () { estadoCab('Guardado · ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })); },
                function (e) { estadoCab('No se ha podido guardar (' + (e && e.code || 'error') + ').', true); });
        colas[ruta].then(res, res);
      }, espera == null ? 700 : espera);
    });
  }
  function guardarDoc(espera) { if (!S.doc) return Promise.resolve(); S.doc.actualizado = ahora(); S.informes[S.doc.id] = S.doc; return escribir('informes/' + S.doc.id, S.doc, espera); }
  function guardarFuentes(espera) { if (!S.doc || !S.fuentes) return Promise.resolve(); return escribir('fuentes/' + S.doc.id, S.fuentes, espera); }
  function anotar(texto) { S.doc.cambios = (S.doc.cambios || []).concat({ fecha: ahora(), texto: texto }).slice(-100); }

  /* ================= Arranque ================= */
  capacidades.then(function () {
    if (C.sample && C.sample.limits) C.sample.limits().then(function (l) { S.limites = l || null; }, function () {});
    if (C.db) {
      C.db.collection('proyectos').onSnapshot(function (snap) {
        S.proyectos = {}; snap.docs.forEach(function (d) { S.proyectos[d.id] = d.data(); });
        if (S.vista === 'inicio' || (S.vista === 'nuevo' && S.paso === 0)) render();
      }, function () {});
      C.db.collection('informes').onSnapshot(function (snap) {
        var nuevos = {};
        snap.docs.forEach(function (d) { nuevos[d.id] = (S.doc && d.id === S.doc.id) ? S.doc : d.data(); });
        if (S.doc) nuevos[S.doc.id] = S.doc;
        S.informes = nuevos;
        S.cargado = true;
        if (S.vista === 'inicio') render();
      }, function () { S.cargado = true; render(); });
    } else { S.cargado = true; }
    render();
  });

  /* ================= Render ================= */
  function render() {
    var main = $('#principal');
    document.body.classList.toggle('con-fondo', S.vista === 'inicio');

    if (S.vista === 'nuevo' && S.paso === 2) prepararSoltar();

  function avisosPlataforma() {

  /* ---------- Pasos 0–3 ---------- */

  function cargarDoc(id) {

      if (d.exists) { var x = d.data(); if (x.informe && x.informe.slides && x.informe.slides.length) S.prev = { tipo: 'estructurado', id: d.id, slides: clon(x.informe.slides), meta: clon(x.informe.meta || {}), version: x.version }; }
    });

      'El equipo ha marcado sobre el slide pintado las partes que quiere cambiar (numeradas; la instrucción puede citarlas por su número). ' +
      'La corrección se refiere a lo MARCADO: localiza en el JSON los textos o elementos indicados y cámbialos; no toques lo no marcado salvo que la instrucción lo pida o haga falta para que el slide quepa. ' +
      'Si una marca rodea o recuadra un bloque entero (tabla, gráfico, foto, lista), la instrucción se aplica a ese bloque.' +
      (conImagen ? ' La PRIMERA imagen adjunta es la captura del slide con las marcas dibujadas (rojo = recuadro, subrayado o trazo; amarillo = resaltado), con su número en un círculo rojo.' : '') + '\n' +
      ms.map(function (m, i) {
        var l = 'Marca ' + (i + 1) + ' · ' + NOMBRE_MARCA[m.tipo] + ' · zona ' + zonaTexto(m);
        if (m.textos && m.textos.length) l += '\n  Texto bajo la marca: ' + m.textos.map(function (x) { return x.marcado !== x.texto ? '«' + x.marcado + '» (dentro de «' + (x.texto.length > 300 ? x.texto.slice(0, 300) + '…' : x.texto) + '»)' : '«' + x.texto + '»'; }).join(' | ');
        if (m.imagenes && m.imagenes.length) l += '\n  Imágenes bajo la marca: ' + m.imagenes.map(function (s) { return 'src "' + s + '"'; }).join(', ');
        if (!(m.textos && m.textos.length) && !(m.imagenes && m.imagenes.length)) l += '\n  (zona sin texto: espacio vacío o elemento gráfico; úsala como ubicación)';
        return l;
      }).join('\n');
  }
  /* Captura del slide (renderizado aparte, sin escala) con las marcas encima, para que Claude la vea. */
  function capturaMarcada(id) {
    var d = S.doc, vis = d.informe.slides.filter(function (s) { return !s.oculto; }), pag = vis.findIndex(function (s) { return s.id === id; }) + 1, s = vis[pag - 1];
    return cargarScript(CDN + 'html2canvas/1.4.1/html2canvas.min.js').then(function () {
      var el = lienzo(), raiz = M.pintar(el, s, pag, d.informe.meta);
      try { M.airear(el); } catch (e) { /* se captura tal cual */ }
      return window.html2canvas(el, { scale: 1.5, backgroundColor: '#ffffff', useCORS: true, logging: false }).then(function (cv) {
        raiz.unmount(); el.remove();
        var out = document.createElement('canvas'); out.width = ANCHO * 1.5; out.height = ALTO * 1.5;
        var ctx = out.getContext('2d'); ctx.drawImage(cv, 0, 0, out.width, out.height); ctx.setTransform(1.5, 0, 0, 1.5, 0, 0);
        (S.marcas[id] || []).forEach(function (m, i) { trazarMarca(ctx, m, i + 1); });
        return new Promise(function (ok) { out.toBlob(ok, 'image/jpeg', .88); });
      }, function (e) { raiz.unmount(); el.remove(); throw e; });
    });
  }
  function borrarMarcas(id) { delete S.marcas[id]; dibujarMarcas(id); }
  document.addEventListener('pointerdown', function (e) {
    var cv = e.target.closest && e.target.closest('.v-marcas'); if (!cv || S.marcando !== cv.getAttribute('data-id') || e.button > 0) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    var p = puntoSlide(cv, e);
    trazo = { id: cv.getAttribute('data-id'), cv: cv, marca: { tipo: S.herramienta, puntos: S.herramienta === 'resaltar' || S.herramienta === 'lapiz' ? [p] : [p, p] } };
    dibujarMarcas(trazo.id);
  });
  document.addEventListener('pointermove', function (e) {
    if (!trazo) return;
    var p = puntoSlide(trazo.cv, e), pts = trazo.marca.puntos;
    if (trazo.marca.tipo === 'subrayar') pts[1] = [p[0], pts[0][1] + (Math.abs(p[1] - pts[0][1]) < 12 ? 0 : p[1] - pts[0][1])];   // recta horizontal salvo que se incline a propósito
    else if (trazo.marca.tipo === 'recuadro') pts[1] = p;
    else { var u = pts[pts.length - 1]; if (Math.hypot(p[0] - u[0], p[1] - u[1]) >= 2) pts.push(p); }
    dibujarMarcas(trazo.id);
  });
  function terminarTrazo() {
    if (!trazo) return;
    var t = trazo, m = t.marca, b = cajaMarca(m); trazo = null;
    var util = m.tipo === 'recuadro' ? (b.x1 - b.x0 > 6 && b.y1 - b.y0 > 6) : m.tipo === 'subrayar' ? b.x1 - b.x0 > 6 : true;
    if (util) { var c = contenidoBajo(t.id, m); m.textos = c.textos; m.imagenes = c.imagenes; (S.marcas[t.id] = S.marcas[t.id] || []).push(m); }
    dibujarMarcas(t.id);
  }
  document.addEventListener('pointerup', terminarTrazo);
  document.addEventListener('pointercancel', terminarTrazo);

  function corregirSlide(id) {
    var d = S.doc, sec = $('#ed-' + CSS.escape(id)), ta = $('textarea', sec), est = $('.estado-corr', sec), instr = ta.value.trim();
    var lista = S.adjuntos[id] || [], marcas = S.marcas[id] || [];
    if (!instr && marcas.length) { est.textContent = 'Escribe qué hay que cambiar en lo marcado.'; ta.focus(); return; }
    if (!instr && !lista.length) { ta.focus(); return; }
    if (!instr) instr = 'Incorpora al slide la información del material adjunto (datos, tablas o imágenes), sin inventar nada.';
    var i = d.informe.slides.findIndex(function (s) { return s.id === id; }), actual = d.informe.slides[i];
    var verImagen = marcas.length && S.limites && S.limites.images;
    if (S.marcando === id) alternarMarcar(id);
    est.textContent = lista.length || verImagen ? 'Preparando las marcas y los adjuntos…' : 'Claude está aplicando la corrección…'; S.abortar = new AbortController();
    var captura = verImagen ? capturaMarcada(id).catch(function () { return null; }) : Promise.resolve(null);
    Promise.all([prepararAdjuntos(id), captura]).then(function (r) {
      var adj = r[0], img = r[1];
      if (img) adj.imagenes = [img].concat(adj.imagenes).slice(0, S.limites.images.maxCount || 4);
      if (marcas.length) adj.texto = marcasTexto(id, !!img) + (adj.texto ? '\n\n' + adj.texto : '');
      return adj;
    }).then(function (adj) {
      if (adj.docs.length) {
        S.fuentes = S.fuentes || { notas: '', documentos: [] }; S.fuentes.documentos = S.fuentes.documentos || [];
        adj.docs.forEach(function (a) { S.fuentes.documentos.push({ nombre: '[corrección · ' + id + '] ' + a.nombre, texto: a.texto }); });
        guardarFuentes(0);
      }
      if (adj.imgs.some(function (a) { return a.id; })) guardarDoc(0);
      est.textContent = 'Claude está aplicando la corrección…';
      return llamar(promptCorreccion(actual, instr, adj), { imagenes: adj.imagenes });
    }).then(function (r) {
      var avisos = r && Array.isArray(r.avisos) ? r.avisos : [];
      var s = actualizarPeriodo(validarSlide(r, id)); s.origen = actual.origen === 'nueva' ? 'nueva' : 'actualizada';
      var m = medir(s);
      if (m.error) throw new Error(m.error);
      d.informe.slides[i] = s; renumerar(d.informe.slides);
      anotar(tituloDe(s) + ': ' + instr + (marcas.length ? ' (' + marcas.length + ' marca' + (marcas.length > 1 ? 's' : '') + ')' : '')); guardarDoc(0);
      var pagina = d.informe.slides.filter(function (x) { return !x.oculto; }).findIndex(function (x) { return x.id === id; }) + 1;
      pintarEnEditor(s, pagina); pintarQa();
      est.textContent = (m.desborde ? 'Aplicada, pero ahora desborda: pide acortarla. ' : 'Aplicada. ') + (avisos.length ? 'Revisa también: ' + avisos.join(' · ') : '');
      ta.value = ''; delete S.adjuntos[id]; pintarAdjuntos(id); borrarMarcas(id);
    }, function (e) { est.textContent = e && e.code ? errorClaude(e) : 'No se pudo aplicar: ' + (e && e.message || e); });
  }
  function moverSlide(id, delta) {
    var sl = S.doc.informe.slides, vis = sl.filter(function (s) { return !s.oculto; }), j = vis.findIndex(function (s) { return s.id === id; }), otro = vis[j + delta];
    if (!otro) return;
    var a = sl.indexOf(vis[j]), b = sl.indexOf(otro); sl[a] = otro; sl[b] = vis[j];
    renumerar(sl); anotar('Orden: ' + tituloDe(vis[j]) + (delta < 0 ? ' sube' : ' baja')); guardarDoc(0); repintarTodo();
    var el = $('#ed-' + CSS.escape(id)); if (el) el.scrollIntoView({ block: 'center' });
  }
  function alternarOculto(id) {
    var s = S.doc.informe.slides.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    s.oculto = !s.oculto; renumerar(S.doc.informe.slides); anotar((s.oculto ? 'Oculta: ' : 'Visible: ') + tituloDe(s)); guardarDoc(0); repintarTodo();
  }
  function anadirDesdeBiblioteca() {
    var n = +$('#ed-bib').value, b = BIB.filter(function (x) { return x.n === n; })[0]; if (!b) return;
    var sl = S.doc.informe.slides, id = idNuevo(b, sl);
    ocupadoEd('Claude está redactando «' + b.nombre + '»…'); S.abortar = new AbortController();
    llamar(promptNueva(id)).then(function (o) {
      var s = actualizarPeriodo(validarSlide(o, id)); s.origen = 'nueva';
      var m = medir(s); if (m.error) throw new Error(m.error);
      sl.push(s); S.doc.informe.slides = ordenar(sl); renumerar(S.doc.informe.slides);
      anotar('Añadida: ' + b.nombre); guardarDoc(0); repintarTodo();
      var el = $('#ed-' + CSS.escape(id)); if (el) el.scrollIntoView({ block: 'center' });
    }, function (e) { ocupadoEd(e && e.code ? errorClaude(e) : 'No se pudo añadir: ' + (e && e.message || e)); });
  }
  function revisarCoherencia() {
    ocupadoEd('Claude está revisando la coherencia del informe…'); S.abortar = new AbortController();
    coherencia().then(function (qa) { S.doc.qa = { coherencia: qa, fecha: ahora() }; guardarDoc(0); ocupadoEd(qa.length ? '' : 'Sin incoherencias detectadas.'); pintarQa(); },
      function (e) { ocupadoEd(errorClaude(e)); });
  }
  function guardarVersion() {
    var d = S.doc, v = d.version || 1;
    ocupadoEd('Guardando la versión ' + v + '…');
    C.db.doc('versiones/' + d.id + '_v' + v).set({ informeId: d.id, version: v, fecha: ahora(), estado: d.estado, informe: clon(d.informe) }).then(function () {
      d.version = v + 1; d.informe.meta.version = 'v' + d.version; anotar('Versión ' + v + ' guardada; se trabaja sobre la ' + d.version); guardarDoc(0);
      ocupadoEd('Versión ' + v + ' guardada. Ahora trabajas en la versión ' + d.version + '.'); repintarTodo();
    }, function (e) { ocupadoEd('No se pudo guardar la versión (' + (e && e.code || 'error') + ').'); });
  }
  function aprobar() {
    var d = S.doc;
    if (d.estado !== 'aprobado') {
      var bloq = qaMecanico(medidasEd).filter(function (x) { return x.nivel === 'error'; });
      if (bloq.length) { ocupadoEd('Hay ' + bloq.length + ' bloqueante(s) en la revisión: resuélvelos antes de aprobar.'); return; }
      d.estado = 'aprobado'; d.informe.meta.estado = 'Aprobado'; anotar('Aprobado');
    } else { d.estado = 'borrador'; d.informe.meta.estado = 'Borrador'; anotar('Vuelve a borrador'); }
    guardarDoc(0); repintarTodo();
  }

  /* ---------- Exportar PDF (en el navegador) ---------- */
  function exportarPdf() {
    var d = S.doc, vis = d.informe.slides.filter(function (s) { return !s.oculto; });
    ocupadoEd('Preparando el PDF…');
    Promise.all([cargarScript(CDN + 'html2canvas/1.4.1/html2canvas.min.js'), cargarScript(CDN + 'jspdf/2.5.1/jspdf.umd.min.js')]).then(function () {
      var pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: [960, 540], compress: true });
      var cont = $('#lienzo-oculto'); cont.classList.add('exportando');
      return vis.reduce(function (p, s, i) {
        return p.then(function () {
          ocupadoEd('Generando página ' + (i + 1) + ' de ' + vis.length + '…');
          var el = lienzo(), raiz = M.pintar(el, s, i + 1, d.informe.meta);
          try { M.airear(el); } catch (e) { /* se exporta tal cual */ }
          return window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false }).then(function (cv) {
            if (i > 0) pdf.addPage([960, 540], 'landscape');
            pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 960, 540);
            raiz.unmount(); el.remove();
          });
        });
      }, Promise.resolve()).then(function () {
        cont.classList.remove('exportando');
        var nombre = qCierre(d.trimestre).replace(/-/g, '') + '_' + d.codigo + '_' + d.trimestre + '_Informe Trimestral Inversores' + (d.estado === 'aprobado' ? '' : ' (borrador v' + (d.version || 1) + ')') + '.pdf';
        ocupadoEd('Confirma la descarga del PDF…');
        return C.downloads.save({ filename: nombre, data: pdf.output('blob') }).then(function () { ocupadoEd('PDF descargado.'); },
          function (e) { ocupadoEd(e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo descargar (' + (e && e.code || 'error') + ').'); });
      });
    }).catch(function (e) { $('#lienzo-oculto').classList.remove('exportando'); ocupadoEd('No se pudo generar el PDF: ' + (e && e.message || e)); });
  }
})();
