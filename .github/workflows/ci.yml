name: CI

on:
  pull_request:
  push:
    branches: [main, chore/flatten-monorepo-and-remove-duplicates]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Type-check (app)
        run: npx tsc --noEmit
      - name: Type-check (scripts/pm)
        run: npm run pm:check-scripts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
